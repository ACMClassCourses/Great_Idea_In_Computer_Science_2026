[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag11"
version = "0.1.0"
description = "RAG pipeline with from-scratch BM25 + evidence-faithfulness evaluation (Basic/Hard)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
