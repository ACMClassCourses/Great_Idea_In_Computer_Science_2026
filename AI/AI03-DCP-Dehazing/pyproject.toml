[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dcp-image-dehazing-teaching"
version = "0.1.0"
description = "Teaching-oriented Dark Channel Prior image dehazing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
]

[project.scripts]
dcp-dehaze = "dcp_dehaze.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
